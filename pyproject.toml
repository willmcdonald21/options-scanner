[project]
name = "options-scanner"
version = "0.1.0"
description = "Copy-trades 0DTE options alerts from a Discord signal channel into an IBKR account"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "ib_async>=2.0",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
