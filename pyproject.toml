[project]
name = "options-scanner"
version = "0.2.0"
description = "Parses Discord option alerts and trades them with a synthetic trim/trail stop ladder"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "ib_async>=2.0",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "exchange_calendars",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["options_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
