# All tunables live here. Secrets (Discord token, channel and user IDs) come
# from .env and are never read from this file -- see .env.example.
#
# dry_run : decide and report, send nothing to the broker
# paper   : trade the paper account
# live    : real money; also requires live_confirmed below AND a typed
#           confirmation at startup
mode: paper          # real orders to the PAPER account (DUR662028, shared with warrior_bot)
live_confirmed: false

entry:
  # Entries are market orders, so a call that passes is bought. This is the
  # buffer: skip the alert if the live ask is more than this % above the
  # alert price. It is checked on the quote just before sending; a market
  # order on a thin book can still fill above it.
  max_slippage_pct: 15
  fill_timeout_seconds: 30      # a market order still unfilled by then is cancelled
  skip_if_ask_above_cap: true   # the move went without us; don't chase
  duplicate_window_seconds: 900  # same contract+entry inside this = a re-paste
  # One-line alerts (QQQ 718P 1.99) have no trim-target checksum. Skip one
  # when the live ask is this far BELOW the alert price: a typo, or not the
  # contract the analyst meant.
  max_ask_below_alert_pct: 25

trim:
  # One sixth at each of +25/+50/+75/+100%, leaving a third running: on 6
  # contracts, 1 at each level and 2 runners.
  #
  # [profit level %, percent of the ORIGINAL position to sell]. Of the
  # original, not of the remainder. Each trim rounds UP, which is why this is
  # 16 and not 16.67: 6 x 0.1667 = 1.0002 rounds up to 2 contracts a trim.
  # 6 x 0.16 = 0.96 rounds up to 1. Larger sizes sell more per level
  # (13 -> 3 each); min_runner_contracts always leaves at least one.
  schedule:
    - [25, 16]
    - [50, 16]
    - [75, 16]
    - [100, 16]

  # The runner's climb. Nothing is sold above the last trim: the runner is
  # reported once at every +25% (+75, +100, +125, +150, ... no upper end).
  # A jump through several steps in one quote gets one card, for the highest.
  # The stop follows stops.steps below, independently of these.
  runner_levels: []
  runner_step_pct: 25

  min_runner_contracts: 1

trail:
  # Off: the step stops in stops.steps are the whole stop. The runners hold
  # the +50% step and are sold by hand or ridden to expiration.
  enabled: false
  arm_at_pct: 75        # the trail starts working here (when enabled)

  # "Trails 60% below the peak": stop = peak * 0.40, tightening as the runner
  # gets large. [peak gain % at or above which it applies, multiplier].
  #
  # Note what 0.40 implies: peak * 0.40 is BELOW entry until the peak reaches
  # 2.5x entry (+150%), so the engine floors every trail stop at the entry
  # fill. Between +75% and +150% breakeven is doing all the work.
  schedule:
    - [0, 0.40]         # 60% below the peak -- the guide's default
    - [200, 0.55]       # 45% below, once up +200%
    - [500, 0.70]       # 30% below, once up +500%

stops:
  # Synthetic, bot-managed. Broker-side stops are not used: a wide 0DTE
  # spread triggers them on bad quotes.
  source_blend: 0.0         # 0 = pure bid (what we can actually sell into)
  confirm_polls: 2          # consecutive quotes below the stop before exiting
  poll_seconds: 1.5
  stale_quote_seconds: 15   # no quotes means no stop -- shout, don't drift
  exit_through_pct: 2.0     # exits price this % through the bid so they fill
  exit_retries: 3           # then escalate: an exit that won't fill must not stay quiet

  # Step stops: [price reached %, stop moves to this % gain]. Breakeven once
  # +25% is reached, then the stop trails two levels behind the price. On a
  # $1.00 fill: +25% -> $1.00, +50% holds, +75% -> $1.25, +100% -> $1.50,
  # and the runners keep $1.50. Driven by the price, so a position too small
  # to trim still gets each stop. No stop before +25%.
  steps:
    - [25, 0]
    - [75, 25]
    - [100, 50]

risk:
  # Every money limit below is a formula of the account, so one config serves
  # both the ~$1,100 live options account and the paper rehearsal.
  #
  #                       live ($1,100)     paper ($4,000)
  #   per trade              $300             $1,090.91
  #   open at once            2                  2
  #   daily loss limit       $400             $1,454.54
  #   trades per day        no cap             no cap

  # PAPER ONLY. The paper account is shared with warrior_bot (IBKR allows one
  # per login) and holds far more, so paper sizes and limits as though it
  # held this. Big enough that each call buys several contracts, so the trims
  # and stops get exercised. Live always uses its real balance.
  paper_equity: 4000

  # Below this, 3% of equity cannot buy a contract, so each trade gets a
  # small-account budget instead: this percent of the account. 27.2727% is
  # exactly $300 on $1,100.
  small_account_below: 5000
  small_account_budget_pct: 27.2727

  # Skip anything dearer than this per contract. null = no ceiling: the
  # slippage buffer above is the only price check.
  max_contract_price: null

  # "1 unit = 2-5% of your account; lotto = half; super lotto = a quarter."
  # The unit applies at or above small_account_below; the tier multipliers
  # apply to either budget. A tier whose budget cannot buy one contract is
  # skipped, never rounded up.
  unit_pct_of_account: 3.0
  lotto_multiplier: 0.5
  super_lotto_multiplier: 0.25

  # dry_run has no broker to ask for equity, and live uses this until its
  # first equity read. A LIVE equity read that fails skips the alert.
  fallback_equity: 1100

  max_usd_per_trade: 1100       # absolute ceiling on any one trade's budget
  max_contracts_per_trade: 50

  # Contracts open at once = floor(account x 55% / one trade's budget).
  max_deployed_pct: 55
  # New entries halt for the day at this loss. 36.3636% is exactly $400 on $1,100.
  max_daily_loss_pct: 36.3636
  # No cap on trades per day: the daily loss limit is what stops a bad day.
  max_trades_per_day: null

market:
  entry_cutoff: "15:30"             # no new entries after this (ET)
  force_exit_enabled: false         # your call; a runner can expire worthless
  force_exit_time: "15:50"
  near_close_warning_minutes: 15    # warn about open runners near the bell

broker:
  # simulated = fills simulated locally against REAL IBKR quotes; nothing is
  #             sent to the broker. The safe default.
  # ibkr      = real orders to whatever account the port points at. On 4002
  #             that is the paper account, but it is still a real order path.
  kind: ibkr        # real orders through Gateway; on 4002 that is the paper account
  host: 127.0.0.1
  port: 4002        # Gateway paper. 4001/7496 are live and are refused here.
  client_id: 12     # must be unique per client; warrior_bot holds 11
  market_data_type: 1

  # The IBKR account this bot trades, e.g. "DU1234567".
  #
  # Blank is correct while the login manages exactly one account. Once a second
  # account is linked under the same username this MUST be set, for two
  # reasons: IBKR rejects any order that does not name an account when more
  # than one is managed, and an unscoped position read would return the other
  # bot's holdings, which feed straight into the sell clamp.
  #
  # Find it with: .venv/bin/python scripts/ib_probe.py
  account: ""

storage:
  db_path: data/options_scanner.sqlite3

logging:
  level: INFO
  file: logs/options_scanner.log
